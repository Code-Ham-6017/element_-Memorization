<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>원소 기호 암기 사이트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Malgun Gothic", Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }
    .container {
      width: min(1000px, 92%);
      margin: 0 auto;
      padding: 30px 0 50px;
    }
    header { text-align: center; margin-bottom: 25px; }
    h1 { margin-bottom: 8px; color: #17324d; }
    header p { color: #64748b; }

    .tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .tab-btn, .answer-btn, .next-btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .tab-btn {
      background: white;
      color: #334155;
      border: 1px solid #d9e2ec;
    }
    .tab-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }
    .tab-btn:hover, .answer-btn:hover, .next-btn:hover { transform: translateY(-1px); }

    .panel {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      background: #f8fafc;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }
    .stat strong { display: block; font-size: 28px; margin-top: 4px; }

    .study-card {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
      background: #f8fbff;
      border: 1px solid #dbeafe;
      border-radius: 18px;
      padding: 35px 25px;
    }
    .atomic-number { color: #64748b; font-weight: 700; }
    .symbol {
      font-size: 76px;
      font-weight: 900;
      color: #2563eb;
      margin: 10px 0;
    }
    .element-name { font-size: 30px; font-weight: 800; }
    .atomic-weight { margin-top: 8px; color: #64748b; }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .next-btn { background: #2563eb; color: white; }
    .next-btn.secondary { background: #e2e8f0; color: #334155; }

    .quiz-box { text-align: center; }
    .quiz-question {
      font-size: 32px;
      font-weight: 900;
      margin: 18px 0 24px;
    }
    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      max-width: 620px;
      margin: 0 auto;
    }
    .answer-btn {
      background: white;
      border: 2px solid #dbe2ea;
      color: #1e293b;
      min-height: 58px;
    }
    .answer-btn.correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #166534;
    }
    .answer-btn.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
    }
    .result {
      min-height: 28px;
      margin-top: 18px;
      font-weight: 800;
    }

    .table {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
      gap: 10px;
    }
    .element-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 15px;
      cursor: pointer;
      transition: 0.15s;
    }
    .element-item:hover {
      border-color: #93c5fd;
      background: #eff6ff;
    }
    .element-item .mini-symbol {
      font-size: 26px;
      font-weight: 900;
      color: #2563eb;
    }
    .element-item .mini-number { color: #64748b; font-size: 13px; }

    .hidden { display: none; }

    @media (max-width: 650px) {
      .stats { grid-template-columns: 1fr; }
      .answers { grid-template-columns: 1fr; }
      .symbol { font-size: 60px; }
      .quiz-question { font-size: 25px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚛ 원소 기호 암기 사이트</h1>
      <p>1~20번 + 자주 나오는 원소를 재미있게 외워보자!</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-mode="study">암기하기</button>
      <button class="tab-btn" data-mode="quiz">퀴즈</button>
      <button class="tab-btn" data-mode="table">원소 목록</button>
    </div>

    <section id="studyPanel" class="panel">
      <div class="stats">
        <div class="stat">현재 원소<strong id="studyIndex">1</strong></div>
        <div class="stat">전체 원소<strong id="totalCount">28</strong></div>
        <div class="stat">퀴즈 점수<strong id="scoreStudy">0</strong></div>
      </div>

      <div class="study-card">
        <div class="atomic-number" id="studyAtomicNumber">원자번호 1</div>
        <div class="symbol" id="studySymbol">H</div>
        <div class="element-name" id="studyName">수소</div>
        <div class="atomic-weight" id="studyWeight">원자량 약 1.008</div>
      </div>

      <div class="controls">
        <button class="next-btn secondary" id="prevBtn">← 이전</button>
        <button class="next-btn" id="nextBtn">다음 →</button>
      </div>
    </section>

    <section id="quizPanel" class="panel hidden">
      <div class="quiz-box">
        <div class="stats">
          <div class="stat">문제<strong id="quizCount">1</strong></div>
          <div class="stat">점수<strong id="quizScore">0</strong></div>
          <div class="stat">연속 정답<strong id="streak">0</strong></div>
        </div>

        <div class="quiz-question" id="quizQuestion">수소의 원소 기호는?</div>
        <div class="answers" id="answers"></div>
        <div class="result" id="result"></div>
        <button class="next-btn hidden" id="quizNextBtn">다음 문제</button>
      </div>
    </section>

    <section id="tablePanel" class="panel hidden">
      <h2>학습할 원소</h2>
      <p style="color:#64748b">원소를 눌러도 암기 화면에서 확인할 수 있어요.</p>
      <div class="table" id="elementTable"></div>
    </section>
  </div>

  <script>
    // 원소 데이터
    // 1~20번 + 요청한 추가 원소 8개
    const elements = [
      { number: 1, symbol: "H",  name: "수소",      weight: "1.008" },
      { number: 2, symbol: "He", name: "헬륨",      weight: "4.003" },
      { number: 3, symbol: "Li", name: "리튬",      weight: "6.94" },
      { number: 4, symbol: "Be", name: "베릴륨",    weight: "9.012" },
      { number: 5, symbol: "B",  name: "붕소",      weight: "10.81" },
      { number: 6, symbol: "C",  name: "탄소",      weight: "12.011" },
      { number: 7, symbol: "N",  name: "질소",      weight: "14.007" },
      { number: 8, symbol: "O",  name: "산소",      weight: "15.999" },
      { number: 9, symbol: "F",  name: "플루오린",  weight: "18.998" },
      { number: 10, symbol: "Ne", name: "네온",      weight: "20.180" },
      { number: 11, symbol: "Na", name: "나트륨",    weight: "22.990" },
      { number: 12, symbol: "Mg", name: "마그네슘",  weight: "24.305" },
      { number: 13, symbol: "Al", name: "알루미늄",  weight: "26.982" },
      { number: 14, symbol: "Si", name: "규소",      weight: "28.085" },
      { number: 15, symbol: "P",  name: "인",        weight: "30.974" },
      { number: 16, symbol: "S",  name: "황",        weight: "32.06" },
      { number: 17, symbol: "Cl", name: "염소",      weight: "35.45" },
      { number: 18, symbol: "Ar", name: "아르곤",    weight: "39.948" },
      { number: 19, symbol: "K",  name: "칼륨",      weight: "39.098" },
      { number: 20, symbol: "Ca", name: "칼슘",      weight: "40.078" },

      // 추가 원소
      { number: 26, symbol: "Fe", name: "철",        weight: "55.845" },
      { number: 29, symbol: "Cu", name: "구리",      weight: "63.546" },
      { number: 25, symbol: "Mn", name: "망가니즈",  weight: "54.938" },
      { number: 30, symbol: "Zn", name: "아연",      weight: "65.38" },
      { number: 47, symbol: "Ag", name: "은",        weight: "107.868" },
      { number: 53, symbol: "I",  name: "아이오딘",  weight: "126.904" },
      { number: 79, symbol: "Au", name: "금",        weight: "196.967" },
      { number: 80, symbol: "Hg", name: "수은",      weight: "200.592" }
    ];

    const studyPanel = document.getElementById("studyPanel");
    const quizPanel = document.getElementById("quizPanel");
    const tablePanel = document.getElementById("tablePanel");

    let studyIndex = 0;
    let quizNumber = 1;
    let quizScore = 0;
    let streak = 0;
    let currentAnswer = null;
    let answered = false;

    document.getElementById("totalCount").textContent = elements.length;

    function renderStudy() {
      const e = elements[studyIndex];
      document.getElementById("studyIndex").textContent = studyIndex + 1;
      document.getElementById("studyAtomicNumber").textContent = `원자번호 ${e.number}`;
      document.getElementById("studySymbol").textContent = e.symbol;
      document.getElementById("studyName").textContent = e.name;
      document.getElementById("studyWeight").textContent = `원자량 약 ${e.weight}`;
      document.getElementById("scoreStudy").textContent = quizScore;
    }

    document.getElementById("prevBtn").addEventListener("click", () => {
      studyIndex = (studyIndex - 1 + elements.length) % elements.length;
      renderStudy();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      studyIndex = (studyIndex + 1) % elements.length;
      renderStudy();
    });

    function switchMode(mode) {
      studyPanel.classList.toggle("hidden", mode !== "study");
      quizPanel.classList.toggle("hidden", mode !== "quiz");
      tablePanel.classList.toggle("hidden", mode !== "table");

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      });

      if (mode === "quiz") startQuiz();
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => switchMode(btn.dataset.mode));
    });

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function startQuiz() {
      answered = false;
      document.getElementById("result").textContent = "";
      document.getElementById("quizNextBtn").classList.add("hidden");

      const target = elements[Math.floor(Math.random() * elements.length)];
      currentAnswer = target;

      document.getElementById("quizQuestion").textContent =
        `${target.name}의 원소 기호는?`;

      const wrongAnswers = shuffle(
        elements.filter(e => e.symbol !== target.symbol)
      ).slice(0, 3);

      const choices = shuffle([target, ...wrongAnswers]);
      const answers = document.getElementById("answers");
      answers.innerHTML = "";

      choices.forEach(choice => {
        const button = document.createElement("button");
        button.className = "answer-btn";
        button.textContent = choice.symbol;
        button.addEventListener("click", () => checkAnswer(button, choice));
        answers.appendChild(button);
      });

      document.getElementById("quizCount").textContent = quizNumber;
      document.getElementById("quizScore").textContent = quizScore;
      document.getElementById("streak").textContent = streak;
    }

    function checkAnswer(button, choice) {
      if (answered) return;
      answered = true;

      const result = document.getElementById("result");

      if (choice.symbol === currentAnswer.symbol) {
        button.classList.add("correct");
        result.textContent = "✅ 정답! 잘했어요.";
        quizScore++;
        streak++;
      } else {
        button.classList.add("wrong");
        result.textContent = `❌ 오답! 정답은 ${currentAnswer.symbol}입니다.`;
        streak = 0;

        document.querySelectorAll(".answer-btn").forEach(btn => {
          if (btn.textContent === currentAnswer.symbol) {
            btn.classList.add("correct");
          }
        });
      }

      document.getElementById("quizScore").textContent = quizScore;
      document.getElementById("streak").textContent = streak;
      document.getElementById("scoreStudy").textContent = quizScore;
      document.getElementById("quizNextBtn").classList.remove("hidden");
    }

    document.getElementById("quizNextBtn").addEventListener("click", () => {
      quizNumber++;
      startQuiz();
    });

    function renderTable() {
      const table = document.getElementById("elementTable");
      table.innerHTML = "";

      elements.forEach((e, index) => {
        const item = document.createElement("div");
        item.className = "element-item";
        item.innerHTML = `
          <div class="mini-number">${e.number}번</div>
          <div class="mini-symbol">${e.symbol}</div>
          <div>${e.name}</div>
        `;

        item.addEventListener("click", () => {
          studyIndex = index;
          renderStudy();
          switchMode("study");
        });

        table.appendChild(item);
      });
    }

    renderTable();
    renderStudy();
  </script>
</body>
</html>
